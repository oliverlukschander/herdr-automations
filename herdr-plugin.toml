id = "dnzzl.automations"
name = "Automations"
version = "0.8.0"
min_herdr_version = "0.8.0"
description = "Cron-scheduled agent prompts for Herdr — the trigger layer: prompt + cron, agent launched in a fresh worktree or the repo root."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["sh", "scripts/run.sh", "daemon"]

[[actions]]
id = "run-now"
title = "Automations: run now"
contexts = ["workspace"]
command = ["sh", "scripts/run.sh", "run", "--pick"]

[[panes]]
id = "board"
title = "Automations"
placement = "overlay"
command = ["sh", "scripts/run.sh", "pane"]

# Starts the scheduler when none is running: `herdr-automations daemon start`
# invokes it from a plain SSH session, so the daemon is spawned by the Herdr
# server with the plugin's environment, as the startup hook would. A live
# daemon is never replaced; this one exits quietly when the lock is held.
[[actions]]
id = "start-scheduler"
title = "Automations: start the scheduler"
contexts = []
command = ["sh", "scripts/run.sh", "daemon"]
