id = "dnzzl.automations"
name = "Automations"
version = "0.8.0"
min_herdr_version = "0.8.0"
description = "Cron-scheduled agent prompts for Herdr — the trigger layer: prompt + cron, agent launched in a fresh worktree or the repo root."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["sh", "scripts/run.sh", "daemon"]

[[actions]]
id = "run-now"
title = "Automations: run now"
contexts = ["workspace"]
command = ["sh", "scripts/run.sh", "run", "--pick"]

[[panes]]
id = "board"
title = "Automations"
placement = "overlay"
command = ["sh", "scripts/run.sh", "pane"]
